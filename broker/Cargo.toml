[package]
name = "cfb-broker"
version = "0.1.0"
edition = "2021"
description = "Single unified Cloudflare alternative broker daemon: embedded tunnel, workerd supervisor, S3 broker, CI runner, and telemetry"
license = "0BSD"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sysinfo = "0.31"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.7"
futures-util = "0.3"
async-trait = "0.1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
