version: "3.8"

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Single Unified cfb-broker (Replaces 7 bloated containers)
  # Embeds: Cloudflare Tunnel, workerd supervisor, S3 broker, CI runner, telemetry
  # ───────────────────────────────────────────────────────────────────────────
  cfb-broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cfb-broker
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET}
    volumes:
      - ./cfb-broker.toml:/etc/cfb-broker.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cfb-data:/var/lib/cfb-broker
      - cfb-cache:/var/cache/cfb-broker
    network_mode: host

volumes:
  cfb-data:
  cfb-cache:
